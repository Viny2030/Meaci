name: MEACI — revisión semanal de novedades

on:
  schedule:
    - cron: "0 6 * * 1"   # Lunes 6am UTC
  workflow_dispatch:        # también se puede correr a mano desde GitHub

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      # Sólo informa: el resultado queda en el resumen de la corrida (Actions → Summary).
      # No escribe en la base (antes insertaba expedientes del DOJ como empresas).
      - name: Revisar novedades
        run: python utils/sync.py
